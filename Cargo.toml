[package]
name = "mrs_auth_pqc"
version = "2.0.0"
edition = "2021"
authors = ["Billal El Issaoui"]
description = "Post-quantum authentication with Diophantine deniability and a framework-native clock KDF."
license = "Apache-2.0"
repository = "https://github.com/A19dammer91/MRS-AUTH-PQC"
documentation = "https://docs.rs/mrs_auth_pqc"
readme = "README.md"
keywords = ["cryptography", "post-quantum", "kyber", "kdf", "diophantine"]
categories = ["cryptography"]
rust-version = "1.70"

[lib]
name = "mrs_auth_pqc"
path = "src/lib.rs"

[dependencies]
pqc_kyber = { version = "0.7", features = ["std", "kyber1024"] }
subtle = { version = "2.6", default-features = false }
zeroize = { version = "1.8", features = ["derive"] }
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10.3"
rand = "0.8"
argon2 = "0.5"
crypto-bigint = { version = "0.6", features = ["hybrid-array"], optional = true }

[features]
default = []
bigint = ["dep:crypto-bigint"]

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "sampler_bench"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docs.rs"]
