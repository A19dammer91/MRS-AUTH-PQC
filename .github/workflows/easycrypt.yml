name: EasyCrypt Proofs

on:
  push:
    branches: [main]
    paths:
      - 'proofs/**'
      - '.github/workflows/easycrypt.yml'
  pull_request:
    paths:
      - 'proofs/**'
  workflow_dispatch:

env:
  OPAMYES: "true"

jobs:
  verify:
    name: Verify EasyCrypt proofs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache opam
        uses: actions/cache@v4
        with:
          path: ~/.opam
          key: opam-${{ runner.os }}-ec-r2024.09

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y opam m4 gcc make git curl pkg-config \
            libgmp-dev libpcre3-dev

      - name: Initialize opam
        run: |
          opam init --disable-sandboxing --bare -y
          opam switch create 4.14.1 -y || opam switch 4.14.1
          eval $(opam env)

      - name: Install SMT solvers
        run: |
          eval $(opam env)
          opam install -y alt-ergo z3

      - name: Install EasyCrypt
        run: |
          eval $(opam env)
          opam pin add -y easycrypt https://github.com/EasyCrypt/easycrypt.git#r2024.09

      - name: Configure Why3
        run: |
          eval $(opam env)
          easycrypt why3config

      - name: Verify all proofs in dependency order
        working-directory: proofs
        run: |
          eval $(opam env)
          for f in \
              MRS_FloorSum.ec \
              MRS_Core.ec \
              MRS_Encoding.ec \
              MRS_Chain.ec \
              MRS_Sampler.ec \
              MRS_Deny.ec \
              MRS_AUTH.ec \
              MRS_Honey.ec; do
            echo "=========================================="
            echo "== Verifying $f"
            echo "=========================================="
            easycrypt "$f" || exit 1
          done
