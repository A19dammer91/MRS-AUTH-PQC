name: EasyCrypt Proofs

on:
  push:
    branches: [main]
    paths:
      - 'proofs/**'
      - '.github/workflows/easycrypt.yml'
  pull_request:
    paths:
      - 'proofs/**'
  workflow_dispatch:

jobs:
  verify:
    name: Verify EasyCrypt proofs
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/easycrypt/ec-build-box:latest
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install EasyCrypt from source
        run: |
          eval $(opam env)
          opam pin add -n easycrypt https://github.com/EasyCrypt/easycrypt.git#r2024.09
          opam install --deps-only easycrypt
          opam install easycrypt

      - name: Verify MRS_FloorSum.ec
        working-directory: proofs
        run: |
          eval $(opam env)
          easycrypt MRS_FloorSum.ec

      - name: Verify MRS_Core.ec
        working-directory: proofs
        run: |
          eval $(opam env)
          easycrypt MRS_Core.ec

      - name: Verify MRS_Chain.ec
        working-directory: proofs
        run: |
          eval $(opam env)
          easycrypt MRS_Chain.ec

      - name: Verify MRS_Sampler.ec
        working-directory: proofs
        run: |
          eval $(opam env)
          easycrypt MRS_Sampler.ec

      - name: Verify MRS_Deny.ec
        working-directory: proofs
        run: |
          eval $(opam env)
          easycrypt MRS_Deny.ec

      - name: Verify MRS_AUTH.ec
        working-directory: proofs
        run: |
          eval $(opam env)
          easycrypt MRS_AUTH.ec

      - name: Verify MRS_Honey.ec
        working-directory: proofs
        run: |
          eval $(opam env)
          easycrypt MRS_Honey.ec
